<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.socket.io https://cdnjs.cloudflare.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src *; connect-src *; img-src * data:;">
    <title>Watch Together</title>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            alert("JS Error: " + msg + " at " + line + ":" + col);
        };
    </script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div style="display: flex; flex-direction: column;">
                <h1 style="margin: 0; display: flex; align-items: center; gap: 10px;">Pekura 
                    <span class="badge" style="background:#8b5cf6;">BETA</span> 
                    <span class="badge" style="background:#10b981;">Ad-Free</span>
                </h1>
                <p style="margin: 4px 0 0 0; font-size: 0.9rem; color: var(--text-muted); font-weight: 500; letter-spacing: 0.5px;">connecting people</p>
            </div>
            <div class="header-actions">
                <div style="display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 5px 5px 5px 10px; border-radius: 12px; border: 1px solid rgba(139, 92, 246, 0.2);">
                    <img id="my-avatar" src="" style="width: 32px; height: 32px; border-radius: 50%; background: transparent; cursor: pointer; transition: transform 0.2s;" title="Change Avatar" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                    <input type="text" id="profile-name" placeholder="Your Name" value="Guest" autocomplete="off" class="profile-input" style="background: transparent; border: none; padding: 5px; width: 120px;">
                </div>
                <div class="room-info" style="display: flex; gap: 10px; align-items: center;">
                    <span id="user-count" class="badge" style="background:#f59e0b;">Users: 1</span>
                    <button id="copy-invite-btn" class="secondary-btn">Copy Room ID</button>
                    <span id="room-status">Initializing...</span>
                    <div style="border-left: 1px solid rgba(255,255,255,0.2); height: 24px; margin: 0 5px;"></div>
                    <input type="text" id="join-room-input" placeholder="Paste ID to Join" style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 6px; color: white; width: 130px; font-size: 0.9rem;">
                    <button id="join-room-btn" class="secondary-btn" style="background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: rgba(16, 185, 129, 0.5);">Join</button>
                </div>
            </div>
        </header>

        <main class="main-layout">
            <div class="left-panel">
                <div class="input-section">
                    <input type="text" id="video-url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
                    <button id="load-btn">Play Now</button>
                    <button id="queue-btn" class="secondary-btn">Add to Queue</button>
                </div>

                <div class="video-container" id="video-wrapper">
                    <div class="drag-handle" id="drag-handle" title="Drag to move">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
                    </div>
                    <div class="iframe-overlay"></div>
                    <!-- The iframe will be inserted here -->
                    <div id="player-container" style="width: 100%; height: 100%;">
                        <div class="placeholder">
                            <p>No video loaded. Paste a URL to begin.</p>
                        </div>
                    </div>
                </div>
                
                <div class="media-controls" id="media-controls">
                    <button id="toggle-camera-btn" class="media-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        <span>Enable Camera</span>
                    </button>
                    <button id="toggle-mic-btn" class="media-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        <span>Enable Mic</span>
                    </button>
                    <button id="screenshare-btn" class="media-btn" style="color: #3b82f6; border-color: rgba(59, 130, 246, 0.5); background: rgba(59, 130, 246, 0.1);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                        <span>Share Screen</span>
                    </button>
                    <div id="host-controls" style="display: none; margin-left: auto;">
                        <button id="host-panel-btn" class="media-btn" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.1);">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                            <span>Host Panel</span>
                        </button>
                    </div>
                </div>
                
                <div class="video-queue-panel">
                    <div class="queue-header">
                        <h3>Up Next</h3>
                        <button id="play-next-btn" class="secondary-btn" style="display: none;">Play Next</button>
                    </div>
                    <ul id="queue-list" class="queue-list">
                        <li class="empty-queue">Queue is empty</li>
                    </ul>
                </div>
            </div>

            <div class="right-panel">
                <div class="chat-container">
                    <div class="chat-header">
                        <h3>Live Chat</h3>
                    </div>
                    <div class="chat-messages" id="chat-messages">
                        <div class="message system">Welcome to Pekura!</div>
                    </div>
                    <div id="typing-indicator" style="display:none; font-size: 0.8rem; color: var(--text-muted); font-style: italic; padding: 5px 15px;">Someone is typing...</div>
                    <div class="chat-input-wrapper" style="position: relative;">
                        <input type="text" id="chat-input" placeholder="Type a message or GIF URL..." autocomplete="off">
                        <button id="gif-menu-btn" class="secondary-btn" title="Send GIF">GIF</button>
                        <button id="send-chat-btn">Send</button>
                        
                        <div id="gif-picker" style="display: none; position: absolute; bottom: 65px; right: 15px; background: white; border-radius: 12px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 280px; z-index: 100;">
                            <input type="text" id="gif-search-input" placeholder="Search Giphy..." autocomplete="off" style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 0.9rem; background: #f9f9f9; color: #333;">
                            <div style="display: flex; flex-wrap: wrap; gap: 8px; max-height: 250px; overflow-y: auto;" id="gif-list">
                                <img src="https://media.giphy.com/media/l41YkxvU8c7J7Bba0/giphy.gif" class="gif-option" style="width: 47%; cursor: pointer; border-radius: 6px;">
                                <img src="https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif" class="gif-option" style="width: 47%; cursor: pointer; border-radius: 6px;">
                                <img src="https://media.giphy.com/media/l0HlHFRbmaZtBRhXG/giphy.gif" class="gif-option" style="width: 47%; cursor: pointer; border-radius: 6px;">
                                <img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" class="gif-option" style="width: 47%; cursor: pointer; border-radius: 6px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Host Modal -->
    <div id="host-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
        <div style="background: rgba(20, 15, 35, 0.9); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 16px; padding: 25px; width: 400px; max-width: 90vw; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h2 style="margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Host Controls</h2>
            <div style="margin: 15px 0; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="lock-room-cb" style="width: 18px; height: 18px; cursor: pointer;">
                <label for="lock-room-cb" style="cursor: pointer; font-weight: bold;">Lock Room <span style="font-size: 0.8rem; font-weight: normal; color: #aaa;">(Prevent new joins)</span></label>
            </div>
            <div style="margin: 15px 0; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="host-only-video-cb" checked style="width: 18px; height: 18px; cursor: pointer;">
                <label for="host-only-video-cb" style="cursor: pointer; font-weight: bold;">Host-Only Video Control</label>
            </div>
            <h3 style="margin-top: 25px; margin-bottom: 15px; font-size: 1rem; color: #aaa;">Connected Users</h3>
            <ul id="connected-users-list" style="list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                <li style="padding: 10px; color: #666; text-align: center; font-style: italic;">No guests yet...</li>
            </ul>
            <div style="margin-top: 25px; text-align: right;">
                <button id="close-host-modal" style="background: #8b5cf6; border: none; padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold;">Done</button>
            </div>
        </div>
    </div>

    <!-- Avatar Selection Modal -->
    <div id="avatar-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
        <div style="background: rgba(20, 15, 35, 0.9); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 16px; padding: 25px; width: 350px; max-width: 90vw; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;">
            <h2 style="margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Choose Your Avatar</h2>
            <div id="avatar-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px;">
                <!-- Avatars injected via JS -->
            </div>
            <div style="display: flex; justify-content: space-between;">
                <button id="shuffle-avatars-btn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer;">Shuffle</button>
                <button id="close-avatar-modal" style="background: #8b5cf6; border: none; padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold;">Close</button>
            </div>
        </div>
    </div>

    <!-- Webcams Container -->
    <div id="webcams-container"></div>
    
    <!-- Socket.io & PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
    <script src="webrtc.js"></script>
</body>
</html>
